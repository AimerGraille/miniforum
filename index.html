<!DOCTYPE html>
<html lang ="fr">
    <head>
        <meta charset="UTF-8">
        <meta name =" viewport " content =" width = device -width , initial - scale =1.0 ">
        <title>MiniForum - Accueil</title>
    </head>
    <body>
        <header>
            <h1>MiniForum</h1>
        </header>

        <main>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="#sujets">Sujets</a></li>
            </ul>

            <section id="sujets">

                <h2>Sujets récents</h2>

                <article id="article1">
                    <h3><a href="sujet.html">Sujet 1</a></h3>
                </article>

                <article id="article2">
                    <h3>Sujet 2</h3>
                </article>

                <article id="article3">
                    <h3>Sujet 3</h3>
                </article>

            </section>

            <section>
                <h2>Nouveau Sujet</h2>
                <form action="/topics" method="post">
                    <fieldset>
                        <legend>Votre message</legend>
                        <p>
                            <label for="pseudo">Pseudo</label>
                            <input type="text" id="pseudo" name="pseudo" placeholder="AimerGraille" required>
                        </p>

                        <p>
                            <label for="titre">Titre du sujet</label>
                            <input type="text" id="titre" name="titre" max="80" required>
                        </p>

                        <p>
                            <label for="message">Contenu</label>
                            <textarea id="message" name="message" rows="6"></textarea>
                        </p>
                    </fieldset>

                    <fieldset>
                        <legend>Options de publication</legend>
                        <p>
                            <label for="categorie">Catégorie</label>
                            <select id="categorie" name="categorie">
                                <option value="general">Général</option>
                                <option value="aide">Aide</option>
                                <option value="projet">Projets</option>
                            </select>
                        </p>

                        <p>
                            <label for="visibilite">Visibilité</label>
                            <p>
                                <input type="radio" id="public" name="visibilite" value="public" checked>
                                <label for="visibilite">Publique</label>
                            </p>

                            <p>
                                <input type="radio" id="prive" name="visibilite" value="prive">
                                <label for="visibilite">Privée</label>
                            </p>
                        </p>
                    </fieldset>

                    <button type="submit">Publier</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Nom du Projet</p>
            <p>Classe Passerelle</p>
        </footer>
    </body>
</html>
